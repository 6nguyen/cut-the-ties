pair:
  title: Kick out Jeffries and Schumer
  summary: Democrats in Congress are about to pick their leaders. House Democrats vote on whether Hakeem Jeffries keeps his job, and Senate Democrats vote on Chuck Schumer. Your representative votes in the first and your senators in the second, so this action has a call for each.
