decider: Senate Democrats, by secret ballot among themselves
this_week: Senators are urging Chris Van Hollen, who led the Senate fight against the integration section, to run against Schumer; he says the caucus needs a discussion before it crowns anyone. Your senator's answer is still open, and now there is a name to give it to.
this_week_date: 2026-11-09
detail_md: |
  **Who is Chuck Schumer?** He leads the Democrats in the Senate. After
  every election, Senate Democrats vote in secret on who leads them. The
  leader decides what the party fights for and what it lets through.

  **Why does this matter for Israel?** This year's military bill has a
  section that ties US troops and weapons to Israel's military for the
  long haul, and the ten-year US weapons deal with Israel runs out in
  2028, when a new one will be on the table. Schumer has not promised to
  fight the first or oppose the second. A leader who will not fight them
  means the Senate never votes on them.

  **What can you do?** Only Democratic senators vote on their leader. The
  ballot is secret, so you cannot ask how they voted, but you can ask what
  they will require of a leader before they vote. If you have a
  Democratic senator, call and ask them to vote for a new leader unless
  Schumer makes those promises in public. If both your senators are
  Republicans, this one is not yours; the military bill or your state is.
prep_md: |
  ## Where things stand
  *As of 2026-11-09.* Senate Democrats pick their leader by secret ballot
  among themselves. No one has formally said they are running against
  Schumer, and five incoming senators have said they will not vote for him
  [VERIFY: count and names, from Democracy Now, The Hill, Star Tribune and
  The Lever, 2026-11-04 to 2026-11-06]. The name being pushed is Chris Van
  Hollen of Maryland: he said he was not seeking the job, then, as calls
  to run grew, said the caucus "needs to have a discussion" before it
  crowns anyone, and a person close to him says the door is not shut
  [VERIFY: The Baltimore Banner 2026-11-09 and The Hill 2026-11-06].
  Senator-elect Abdul El-Sayed has said he would vote for Van Hollen over
  Schumer. Van Hollen is our pick: he led this summer's Senate letter
  against the military bill's Israel provisions and filed the amendments
  to strike the integration section (sources below). He has not yet
  promised it as a condition of leading, so the ask stays a condition: back
  him, and get the promise from him in public too. The vote date is not
  published:
  press says December, and our placeholder is 2027-01-05 [VERIFY: the
  caucus date]. Because the ballot is secret, what you can ask your
  senator for is a condition they will apply, said out loud before the
  vote.

  ## Timeline
  - 2026-11-01: our window opens.
  - 2026-11-04: midterm results in; talk of replacing Schumer starts.
  - 2026-11-06: Schumer says he is running again and has the votes; a
    source says Van Hollen will not challenge him [VERIFY: The Hill
    2026-11-06].
  - 2026-11-09: Van Hollen, urged to run, says the caucus needs a
    discussion before it crowns anyone [VERIFY: The Baltimore Banner
    2026-11-09].
  - December 2026: Senate Democrats expected to vote on their leader
    [VERIFY: date].
  - 2027-01-05: placeholder date in our data until the real one is
    published.
  - 2027-01-31: our window closes.
  - 2028: the current ten-year US weapons deal with Israel runs out, so a
    new one is the next fight [VERIFY: expiry year and the status of any
    replacement talks].

  ## What to say in 30 seconds
  "Hi, I'm a constituent from [your town]. Senate Democrats are about to
  pick a leader. I'm asking Senator [name] to vote for a new leader unless
  Chuck Schumer promises, in public, to take the Israel integration
  section out of the military bill and to oppose a new long-term weapons
  deal with Israel. Chris Van Hollen led the fight against that section in
  the Senate, and I'm asking the Senator to back him, and to ask him for
  that promise in public too. Will the Senator tell me whether that is a
  condition for their vote?"

  ## Likely pushback and answers
  - **"The ballot is secret."** You are asking for the condition, not the
    ballot. A senator can say what they will require of a leader without
    saying how they voted.
  - **"Nobody is running against him yet."** Chris Van Hollen is being
    urged to, and says the caucus should talk before it crowns anyone.
    That is why now: a senator who says out loud they want him in the race
    is what makes the race. Ask the Senator to say it.
  - **"The Senator is backing Van Hollen."** Good, then ask the Senator to
    get the promise from him in public before the vote. He led the fight
    against the section, but a new leader without the promise is the same
    problem with a new face.
  - **"The Senator prefers someone else."** Fine; the condition goes to
    whoever they back. Ask the Senator to put it to that candidate in
    public.
  - **"Leadership is about much more than one issue."** Agreed. This is
    one promise asked of every candidate, not a test on everything else.
  - **"Why only Democrats?"** Only Democratic senators vote on their
    leader, so a Republican senator is not a target for this goal.

  ## What counts as a win
  Your senator tells you, or says publicly, that they will apply the
  condition. Bigger: a candidate makes the promise, or the elected leader
  does. Report the answer you got; we record positions from reports, with
  a source.

  ## Sources
  Dated reporting behind this page is listed below. Everything marked
  VERIFY above is waiting on a primary source.
