title: Block the military bill if Israel integration stays in
summary: Once the final military bill is filed, nobody can change a word. Each member gets one yes-or-no vote on the whole thing. If the Israel integration section is still in it, a no vote from your member is the last chance this year.
what_we_want: Your representative and senators vote no on the final military bill if the Israel integration section is still in it.
