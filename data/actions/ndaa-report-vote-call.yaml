id: 3
slug: ndaa-report-vote-call
goal: ndaa-report-vote
type: call
target_scope: both
order: 1
ask_text: Ask your member to vote no on the final military bill because the Israel integration section is still in it.
email_subject: 'Constituent in {city}: vote no on the final NDAA while section 1217 stays in'
form_schema:
  fields:
    - {name: first_name, label: First name, max: 40, required: true}
    - {name: city, label: City, max: 60, required: true}
    - {name: why, label: Why this matters to you, max: 280, required: true, multiline: true, hint: One or two sentences in your own words.}
    - {name: affiliation, label: Occupation or affiliation (optional), max: 80, required: false}
prompt_template: |
  Open with the caller's first name and city. The conference report is filed and cannot be amended: ask the member to
  vote no on the NDAA conference report because it keeps the integration section. Name the prior vote if the facts list
  one. Use the caller's reason as their own words and close by asking how the member will vote.
doc_format: {"kind": "call_script", "min_words": 60, "max_words": 160, "mentions": ["conference report", "integration section"], "ask": "vote no"}
standard_template: |
  Hi, my name is {{user_first_name}} and I live in {{user_city}}. I am a constituent of {{target_role}} {{target_name}}.
  I am calling about the NDAA conference report. It keeps the integration section, and I am asking {{target_role}} {{target_name}} to vote no on the conference report because of it. {{prior_vote_line}} {{position_line}}
  {{user_why}}
  Can you tell me how {{target_role}} {{target_name}} plans to vote, and when the office will say so publicly? Thank you for your time.
