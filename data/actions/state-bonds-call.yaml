id: 5
slug: state-bonds-call
goal: state-bonds
type: call
target_scope: state
order: 1
ask_text: Ask {decider} whether the state holds Israel Bonds and when they will stop renewing them.
email_subject: 'Constituent in {city}: does the state still hold Israel Bonds?'
short_label: Israel bonds
form_schema:
  fields:
    - {name: first_name, label: First name, max: 40, required: true}
    - {name: city, label: City, max: 60, required: true}
    - {name: why, label: Why this matters to you, max: 280, required: true, multiline: true, hint: One or two sentences in your own words.}
    - {name: affiliation, label: Occupation or affiliation (optional), max: 80, required: false}
prompt_template: |
  Open with the caller's first name and city as a resident of the state. Ask the treasurer's office whether the state
  holds Israel Bonds, how much, and when it will stop rolling them over. Quote the holdings figure only if the facts list
  one. Close by asking for a written answer and the date of the next public comment opportunity.
doc_format: {"kind": "call_script", "min_words": 60, "max_words": 160, "mentions": ["Israel Bonds"], "ask": "rolling them over"}
standard_template: |
  Hi, my name is {{user_first_name}} and I live in {{user_city}}. I am calling the office of {{target_name}} about the state's holdings of Israel Bonds.
  I would like to know whether the state holds Israel Bonds today, how much, and when the office will stop rolling them over as they mature.
  {{user_why}}
  Could the office send me a written answer, and tell me the date of the next public comment opportunity on the state's investments? Thank you for your time.
