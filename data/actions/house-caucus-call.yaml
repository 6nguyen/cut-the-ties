id: 1
slug: house-caucus-call
goal: house-caucus
type: call
# call-the-right-office §1.1: the office that handles this ask (dc | district); a vote or leadership ask is DC's.
office: dc
target_scope: house
order: 1
ask_text: Ask your representative to vote for a new leader unless Hakeem Jeffries promises, in public, to take the Israel integration section out of the military bill.
email_subject: 'Constituent in {city}: vote only for a leader who drops the integration section'
short_label: Jeffries vote
form_schema:
  fields:
    - {name: first_name, label: First name, max: 40, required: true}
    - {name: city, label: City, max: 60, required: true}
    - {name: why, label: Why this matters to you, max: 280, required: true, multiline: true, hint: One or two sentences in your own words.}
    - {name: affiliation, label: Occupation or affiliation (optional), max: 80, required: false}
prompt_template: |
  Open with the caller's first name and city. House Democrats are about to vote on their leader: ask the representative
  to vote only for a leader who commits, in public, to stripping the integration section from the NDAA. Name the prior
  vote if the facts list one. Close by asking whether that is a condition for their vote and when the office will say so.
doc_format: {"kind": "call_script", "min_words": 60, "max_words": 160, "mentions": ["integration section", "leader"], "ask": "vote only for a leader"}
script_blocks: leadership
